<div class="auth-page-wrapper">
  <div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100 py-4">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        
        <!-- Tarjeta de Login -->
        <div class="auth-card shadow-lg">
          
          <!-- Encabezado de la Tarjeta -->
          <div class="auth-header text-center">
            <div class="auth-brand-badge mb-3">
              <span>TP</span>
            </div>
            <h3 class="auth-title">Iniciar Sesión</h3>
            <p class="auth-subtitle">Accede al panel de administración de Tomás Peresin</p>
          </div>

          <!-- Si ya está logueado -->
          <div *ngIf="isLogged" class="text-center py-3">
            <div class="alert alert-success d-flex align-items-center justify-content-center gap-2 mb-4" role="alert">
              <i class="bi bi-check-circle-fill"></i>
              <div>Ya has iniciado sesión activamente</div>
            </div>
            <div class="d-grid gap-2">
              <a routerLink="/" class="btn btn-primary-modern justify-content-center">
                <i class="bi bi-house-door me-1"></i> Ir al Portfolio
              </a>
              <button class="btn btn-outline-modern justify-content-center" (click)="onLogOut()">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
              </button>
            </div>
          </div>

          <!-- Formulario de Login -->
          <form *ngIf="!isLogged" #f="ngForm" (ngSubmit)="onLogin()" novalidate class="auth-form mt-4">
            
            <!-- Mensaje de Error -->
            <div *ngIf="isLoginFail" class="alert alert-danger d-flex align-items-center gap-2 mb-4" role="alert">
              <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
              <div class="small">{{ errMsj }}</div>
            </div>

            <!-- Campo Usuario -->
            <div class="form-group mb-3">
              <label class="form-label-custom" for="nombreUsuario">
                <i class="bi bi-person me-1"></i> Nombre de Usuario
              </label>
              <div class="input-icon-group">
                <i class="bi bi-person-circle input-icon-left"></i>
                <input
                  type="text"
                  id="nombreUsuario"
                  name="nombreUsuario"
                  class="form-control form-control-custom"
                  [(ngModel)]="nombreUsuario"
                  placeholder="Ingresa tu usuario"
                  required
                  autocomplete="username"
                />
              </div>
            </div>

            <!-- Campo Contraseña -->
            <div class="form-group mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label-custom mb-0" for="password">
                  <i class="bi bi-lock me-1"></i> Contraseña
                </label>
                <a routerLink="/recuperar-password" class="auth-link-small">
                  ¿Olvidaste tu contraseña?
                </a>
              </div>
              <div class="input-icon-group">
                <i class="bi bi-key input-icon-left"></i>
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  id="password"
                  name="password"
                  class="form-control form-control-custom"
                  [(ngModel)]="password"
                  placeholder="Ingresa tu contraseña"
                  required
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="btn-toggle-password"
                  (click)="toggleShowPassword()"
                  [title]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'"
                  tabindex="-1"
                >
                  <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                </button>
              </div>
            </div>

            <!-- Botón Submit -->
            <button
              class="btn btn-primary-modern w-100 justify-content-center py-2 mt-4"
              type="submit"
              [disabled]="isLoading"
            >
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
              <i *ngIf="!isLoading" class="bi bi-box-arrow-in-right me-1"></i>
              {{ isLoading ? 'Iniciando sesión...' : 'Ingresar' }}
            </button>

            <!-- Separador -->
            <div class="auth-divider my-4">
              <span>¿No tienes una cuenta?</span>
            </div>

            <!-- Enlace a Registro -->
            <div class="text-center">
              <a routerLink="/nuevousuario" class="btn btn-outline-modern w-100 justify-content-center py-2">
                <i class="bi bi-person-plus me-1"></i> Crear Nueva Cuenta
              </a>
            </div>

          </form>

          <!-- Footer de la Tarjeta -->
          <div class="auth-footer text-center mt-4 pt-3 border-top">
            <a routerLink="/" class="back-home-link">
              <i class="bi bi-arrow-left me-1"></i> Volver al Portfolio
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
