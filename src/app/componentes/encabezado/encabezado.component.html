<nav class="navbar navbar-expand-lg fixed-top modern-navbar">
  <div class="container">
    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center gap-2" href="#sobre-mi">
      <div class="brand-badge">TP</div>
      <span class="brand-text">Tomás <strong>Peresin</strong></span>
    </a>

    <!-- Mobile Toggler -->
    <button class="navbar-toggler custom-toggler" type="button" (click)="toggleNavbar()" aria-label="Toggle navigation">
      <i class="bi bi-list"></i>
    </button>

    <!-- Nav Links y Actions -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 nav-menu">
        <li class="nav-item">
          <a class="nav-link" href="#sobre-mi" (click)="closeNavbar()">Sobre mí</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#proyectos" (click)="closeNavbar()">Proyectos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#experiencia" (click)="closeNavbar()">Experiencia</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#educacion" (click)="closeNavbar()">Educación</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#skills" (click)="closeNavbar()">Habilidades</a>
        </li>
      </ul>

      <!-- Right Actions: Social, Theme Toggle y Login -->
      <div class="d-flex align-items-center gap-3 nav-actions">
        <!-- GitHub Link -->
        <a class="btn-icon-link" href="https://github.com/TomasPeresin" target="_blank" rel="noopener noreferrer" title="GitHub">
          <i class="bi bi-github"></i>
        </a>

        <!-- LinkedIn Link -->
        <a class="btn-icon-link" href="https://linkedin.com/in/tomas-peresin" target="_blank" rel="noopener noreferrer" title="LinkedIn">
          <i class="bi bi-linkedin"></i>
        </a>

        <!-- Theme Switcher -->
        <button class="btn-theme-toggle" (click)="toggleTheme()" [title]="isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'" aria-label="Cambiar tema">
          <i class="bi" [ngClass]="isDark ? 'bi-sun-fill text-warning' : 'bi-moon-stars-fill'"></i>
        </button>

        <!-- Auth Controls -->
        @if (!isLogged) {
          <button type="button" class="btn btn-login-compact" (click)="Login()">
            <i class="bi bi-person-lock me-1"></i> Admin
          </button>
        } @else {
          <div class="dropdown">
            <button class="btn btn-admin-logged dropdown-toggle" type="button" (click)="toggleDropdown()">
              <i class="bi bi-shield-check me-1"></i> Admin Activo
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow" [class.show]="showDropdown">
              <li><button class="dropdown-item text-danger" (click)="onLogOut()"><i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión</button></li>
            </ul>
          </div>
        }
      </div>
    </div>
  </div>
</nav>
