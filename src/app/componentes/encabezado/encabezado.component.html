        <img src="../../../assets/APLogo.png" alt="Logo" width="30" height="30" class="d-inline-block align-top logo-animation">
      </a>
    </div>

    <!-- Botón para móviles -->
    <button class="navbar-toggler" type="button" (click)="toggleNavbar()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menú principal -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <!-- Iconos de redes sociales -->
        <li class="nav-item social-icon">
          <a class="nav-link" href="" target="_blank">
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="" target="_blank">
            Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="" target="_blank">
            Trabajos realizados
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="" target="_blank">
            Proyectos personales
          </a>
        </li>
        <li class="nav-item social-icon">
          <a class="nav-link" href="https://github.com/TomasPeresin" target="_blank">
            <i class="bi bi-github"></i>
          </a>
        </li>
      </ul>

      <div class="d-flex">
        <button class="btn btn-theme" (click)="toggleTheme()">
          <i class="bi" [ngClass]="isDark ? 'bi-sun' : 'bi-moon'"></i>
        </button>
        <!-- Botones de autenticación -->
        @if (!isLogged) {
          <button type="button" class="btn btn-login" (click)="Login()">
            Iniciar sesión
          </button>
        } @else {
          <div class="dropdown">
            <button class="btn btn-logout dropdown-toggle" (click)="toggleDropdown()">
              Cerrar sesión
            </button>

              <li><a class="dropdown-item" href="#">Perfil</a></li>
              <li><a class="dropdown-item" href="#">Configuración</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><button class="dropdown-item" (click)="onLogOut()">Salir</button></li>
            </ul>
          </div>

      </div>

  </div>
