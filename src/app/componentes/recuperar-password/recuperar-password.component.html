<div class="auth-page-wrapper">
  <div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100 py-4">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        
        <!-- Tarjeta de Recuperar Contraseña -->
        <div class="auth-card shadow-lg">
          
          <!-- Encabezado de la Tarjeta -->
          <div class="auth-header text-center mb-4">
            <div class="auth-brand-badge mb-3">
              <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="auth-title">Recuperar Clave</h3>
            <p class="auth-subtitle">Ingresa tu correo para recibir el enlace de restablecimiento</p>
          </div>

          <!-- Mensaje de Éxito -->
          <div *ngIf="isSuccess" class="text-center py-2">
            <div class="alert alert-success d-flex align-items-center gap-2 mb-4" role="alert">
              <i class="bi bi-envelope-check-fill flex-shrink-0 fs-4"></i>
              <div class="text-start">
                <div class="fw-semibold">¡Correo enviado!</div>
                <div class="small">{{ successMsj }}</div>
              </div>
            </div>
            <p class="text-muted small mb-4">
              Revisa tu bandeja de entrada o carpeta de spam y sigue el enlace para definir una nueva contraseña.
            </p>
            <a routerLink="/login" class="btn btn-primary-modern w-100 justify-content-center py-2">
              <i class="bi bi-arrow-left me-1"></i> Volver al Inicio de Sesión
            </a>
          </div>

          <!-- Formulario de Solicitud -->
          <form *ngIf="!isSuccess" #f="ngForm" (ngSubmit)="onSubmit()" novalidate class="auth-form">
            
            <!-- Mensaje de Error -->
            <div *ngIf="isError" class="alert alert-danger d-flex align-items-center gap-2 mb-4" role="alert">
              <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
              <div class="small">{{ errMsj }}</div>
            </div>

            <!-- Campo Correo Electrónico -->
            <div class="form-group mb-3">
              <label class="form-label-custom" for="email">
                <i class="bi bi-envelope me-1"></i> Correo Electrónico Registrado
              </label>
              <div class="input-icon-group">
                <i class="bi bi-at input-icon-left"></i>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-control form-control-custom"
                  [(ngModel)]="email"
                  placeholder="ejemplo@correo.com"
                  required
                  autocomplete="email"
                />
              </div>
            </div>

            <!-- Botón Submit -->
            <button
              class="btn btn-primary-modern w-100 justify-content-center py-2 mt-4"
              type="submit"
              [disabled]="isLoading"
            >
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
              <i *ngIf="!isLoading" class="bi bi-send me-1"></i>
              {{ isLoading ? 'Enviando enlace...' : 'Enviar Enlace de Recuperación' }}
            </button>

            <!-- Separador -->
            <div class="auth-divider my-4">
              <span>O</span>
            </div>

            <!-- Enlace a Login -->
            <div class="text-center">
              <a routerLink="/login" class="btn btn-outline-modern w-100 justify-content-center py-2">
                <i class="bi bi-arrow-left me-1"></i> Recordé mi contraseña
              </a>
            </div>

          </form>

          <!-- Footer de la Tarjeta -->
          <div class="auth-footer text-center mt-4 pt-3 border-top">
            <a routerLink="/" class="back-home-link">
              <i class="bi bi-arrow-left me-1"></i> Volver al Portfolio
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
