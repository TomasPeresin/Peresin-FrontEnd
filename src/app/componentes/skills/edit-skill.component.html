<section class="form-page-wrapper">
  @if (skillLab) {
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
          <div class="form-card shadow-lg">
            <div class="d-flex align-items-center justify-content-between mb-4">
              <h3 class="m-0 font-weight-bold">Modificar Tecnología</h3>
              <button type="button" class="btn btn-sm btn-outline-modern" routerLink="/">
                <i class="bi bi-arrow-left me-1"></i> Volver
              </button>
            </div>

            <form (ngSubmit)="onUpdate()" novalidate #f="ngForm">
              <div class="mb-4">
                <label for="nombre" class="form-label font-weight-bold">Nombre de la Tecnología o Herramienta *</label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  class="form-control"
                  [(ngModel)]="skillLab.nombre"
                  required
                />
              </div>

              <div class="d-grid gap-2">
                <button class="btn btn-primary-modern justify-content-center py-2" type="submit" [disabled]="!skillLab.nombre.trim()">
                  <i class="bi bi-check2-circle me-1"></i> Actualizar Tecnología
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  }
</section>
