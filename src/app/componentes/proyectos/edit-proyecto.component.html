<section class="form-page-wrapper py-5">
  @if (proyectoLab) {
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card-modern p-4 p-md-5">
            <div class="d-flex align-items-center justify-content-between mb-4">
              <h3 class="m-0 font-weight-bold">Modificar Proyecto</h3>
              <button type="button" class="btn btn-sm btn-outline-modern" routerLink="/">
                <i class="bi bi-arrow-left"></i> Volver
              </button>
            </div>

            <form (ngSubmit)="onUpdate()" novalidate #f="ngForm">
              <div class="mb-3">
                <label for="nombre" class="form-label font-weight-bold">Nombre del proyecto *</label>
                <input type="text" id="nombre" name="nombre" class="form-control" [(ngModel)]="proyectoLab.nombre" required />
              </div>

              <div class="mb-3">
                <label for="descripcion" class="form-label font-weight-bold">Descripción / Caso de estudio *</label>
                <textarea id="descripcion" name="descripcion" class="form-control" rows="4" [(ngModel)]="proyectoLab.descripcion" required></textarea>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="fecha" class="form-label font-weight-bold">Año *</label>
                  <input type="number" id="fecha" name="fecha" class="form-control" min="2015" max="2030" [(ngModel)]="proyectoLab.fecha" required />
                </div>

                <div class="col-md-6 mb-3">
                  <label for="link" class="form-label font-weight-bold">Enlace (GitHub / Docs / Demo) *</label>
                  <input type="text" id="link" name="link" class="form-control" [(ngModel)]="proyectoLab.link" required />
                </div>
              </div>

              <div class="mb-4">
                <label for="img" class="form-label font-weight-bold">URL de Imagen / Captura (Opcional)</label>
                <input type="text" id="img" name="img" class="form-control" [(ngModel)]="proyectoLab.img" placeholder="https://... o ruta de imagen" />
                @if (proyectoLab.img) {
                  <div class="mt-2 text-center">
                    <img [src]="proyectoLab.img" class="img-thumbnail rounded" style="max-height: 140px;" alt="Previsualización">
                  </div>
                }
              </div>

              <div class="d-grid gap-2">
                <button class="btn btn-primary-modern" type="submit" [disabled]="!f.valid">
                  <i class="bi bi-check2-circle"></i> Actualizar Proyecto
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  }
</section>
